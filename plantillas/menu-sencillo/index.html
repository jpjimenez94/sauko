<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menú</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
  <style>
    /* Página de menú sin pedidos en línea: muestra los platos y lleva al WhatsApp del restaurante. */
    :root {
      --marca: #b3261e; --acento: #f2a900;
      --fondo: #fbf7f1; --tarjeta: #ffffff; --tinta: #231f1c; --suave: #6f665e; --linea: #e9e1d6; --wa: #1faa59;
      --titulos: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
      --texto: "DM Sans", system-ui, sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--fondo); color: var(--tinta); font: 400 1rem/1.5 var(--texto); padding-bottom: 5.5rem; }
    a { color: inherit; }
    img { max-width: 100%; display: block; }
    [hidden] { display: none !important; }

    .cabeza { background: var(--marca); color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 2rem) 1rem 2.2rem; text-align: center; }
    .cabeza img { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; background: #fff; margin: 0 auto 0.8rem; }
    .cabeza h1 { font: 800 clamp(2rem, 8vw, 3.2rem)/1 var(--titulos); text-wrap: balance; }
    .cabeza p { margin-top: 0.5rem; opacity: 0.92; text-wrap: balance; }

    .datos { max-width: 760px; margin: -1.2rem auto 0; padding: 0 1rem; }
    .datos ul { list-style: none; padding: 1rem 1.1rem; background: var(--tarjeta); border-radius: 18px; box-shadow: 0 6px 20px rgba(35, 31, 28, 0.08); display: grid; gap: 0.45rem; font-size: 0.95rem; }
    .datos b { color: var(--marca); }

    .categorias { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--fondo); border-bottom: 1px solid var(--linea); margin-top: 1.2rem; }
    .categorias div { max-width: 760px; margin: 0 auto; display: flex; gap: 0.5rem; padding: 0.7rem 1rem; overflow-x: auto; scrollbar-width: none; }
    .categorias a { flex: none; padding: 0.45rem 1rem; border-radius: 999px; background: var(--tarjeta); border: 1.5px solid var(--linea); text-decoration: none; font-weight: 700; font-size: 0.92rem; }
    .categorias a:hover, .categorias a:focus-visible { border-color: var(--marca); color: var(--marca); }

    main { max-width: 760px; margin: 0 auto; padding: 0 1rem; }
    section { padding-top: 1.6rem; scroll-margin-top: 4rem; }
    section h2 { font: 800 1.7rem/1.1 var(--titulos); color: var(--marca); }
    section > p { color: var(--suave); font-size: 0.92rem; margin-top: 0.2rem; }
    .lista { display: grid; gap: 0.7rem; margin-top: 0.9rem; }
    .plato { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.3rem 1rem; align-items: start; background: var(--tarjeta); border-radius: 16px; padding: 0.9rem 1rem; border: 1px solid var(--linea); }
    .plato.con-foto { grid-template-columns: 84px minmax(0, 1fr) auto; }
    .plato img { width: 84px; height: 84px; border-radius: 12px; object-fit: cover; grid-row: span 2; }
    .plato h3 { font-size: 1.05rem; font-weight: 700; line-height: 1.25; }
    .plato .precio { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--tinta); background: color-mix(in srgb, var(--acento) 28%, transparent); padding: 0.1rem 0.6rem; border-radius: 999px; }
    .plato p { grid-column: 1 / -1; color: var(--suave); font-size: 0.92rem; }
    .plato.con-foto p { grid-column: 2 / -1; }

    .pedir { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; padding: 0.8rem 1rem calc(env(safe-area-inset-bottom, 0px) + 0.8rem); background: linear-gradient(to top, var(--fondo) 65%, transparent); display: flex; justify-content: center; }
    .pedir a { display: inline-flex; align-items: center; gap: 0.6rem; background: var(--wa); color: #fff; text-decoration: none; font-weight: 700; font-size: 1.05rem; padding: 0.85rem 1.6rem; border-radius: 999px; box-shadow: 0 8px 22px rgba(31, 170, 89, 0.35); }
    .pedir svg { width: 22px; height: 22px; }

    footer { max-width: 760px; margin: 2.5rem auto 0; padding: 1.2rem 1rem; border-top: 1px solid var(--linea); color: var(--suave); font-size: 0.85rem; display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; justify-content: space-between; }
  </style>
</head>
<body>
  <header class="cabeza">
    <img id="logo" alt="" hidden>
    <h1 id="nombre"></h1>
    <p id="lema"></p>
  </header>

  <div class="datos"><ul id="datos"></ul></div>
  <nav class="categorias" aria-label="Categorías del menú"><div id="categorias"></div></nav>
  <main id="menu"></main>

  <div class="pedir"><a id="pedir" target="_blank" rel="noopener">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C8.800 3 3 8.600 3 15.500c0 2.500.800 4.900 2.200 6.900L3.500 29l6.900-1.800c1.700.800 3.600 1.300 5.600 1.300 7.200 0 13-5.600 13-12.500S23.200 3 16 3z" fill="currentColor"/></svg>
    Pedir por WhatsApp
  </a></div>

  <footer><span id="pie-nombre"></span><span id="pie-hecho"></span></footer>

  <script src="menu.js"></script>
  <script>
    const M = window.MENU || {};
    const $ = id => document.getElementById(id);
    const pesos = n => '$' + Math.round(n).toLocaleString('es-CO');
    const ancla = t => 'c-' + String(t).toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').replace(/[^a-z0-9]+/g, '-');
    function crear(tag, props, ...hijos) {
      const el = document.createElement(tag);
      for (const k in (props || {})) { if (k === 'class') el.className = props[k]; else el.setAttribute(k, props[k]); }
      for (const h of hijos) if (h != null) el.append(h);
      return el;
    }

    // Marca
    if (M.color) document.documentElement.style.setProperty('--marca', M.color);
    if (M.acento) document.documentElement.style.setProperty('--acento', M.acento);
    document.title = (M.nombre || 'Menú') + ' · Menú';
    document.querySelector('meta[name=description]').setAttribute('content', [M.nombre, M.lema, M.direccion].filter(Boolean).join(' · '));
    $('nombre').textContent = M.nombre || '';
    $('lema').textContent = M.lema || '';
    if (M.logo) { $('logo').src = M.logo; $('logo').alt = 'Logo de ' + (M.nombre || 'el restaurante'); $('logo').hidden = false; }

    // Datos del local
    const datos = [['Dirección', M.direccion], ['Horario', M.horario], ['Domicilios', M.domicilio]].filter(d => d[1]);
    $('datos').replaceChildren(...datos.map(([titulo, valor]) => crear('li', null, crear('b', null, titulo + ': '), valor)));
    if (M.instagram) $('datos').append(crear('li', null, crear('a', { href: M.instagram, target: '_blank', rel: 'noopener' }, 'Instagram')));
    $('datos').parentElement.hidden = !$('datos').childElementCount;

    // Menú
    const categorias = (M.categorias || []).filter(c => c.productos && c.productos.length);
    $('categorias').replaceChildren(...categorias.map(c => crear('a', { href: '#' + ancla(c.nombre) }, c.nombre)));
    $('categorias').parentElement.hidden = categorias.length < 2;
    $('menu').replaceChildren(...categorias.map(c => crear('section', { id: ancla(c.nombre) },
      crear('h2', null, c.nombre),
      c.nota ? crear('p', null, c.nota) : null,
      crear('div', { class: 'lista' }, ...c.productos.map(p => crear('article', { class: 'plato' + (p.foto ? ' con-foto' : '') },
        p.foto ? crear('img', { src: p.foto, alt: p.nombre, loading: 'lazy' }) : null,
        crear('h3', null, p.nombre),
        crear('span', { class: 'precio' }, pesos(p.precio)),
        p.detalle ? crear('p', null, p.detalle) : null))))));

    // Pedir: abre el WhatsApp del restaurante con un saludo ya escrito.
    const numero = String(M.whatsapp || '').replace(/\D/g, '');
    $('pedir').href = 'https://wa.me/' + numero + '?text=' + encodeURIComponent('Hola, quiero hacer un pedido');
    $('pedir').parentElement.hidden = !numero;

    // Pie
    $('pie-nombre').textContent = [M.nombre, M.direccion].filter(Boolean).join(' · ');
    if (M.hechoPor) $('pie-hecho').replaceChildren(M.hechoPorEnlace ? crear('a', { href: M.hechoPorEnlace, target: '_blank', rel: 'noopener' }, M.hechoPor) : M.hechoPor);
  </script>
</body>
</html>
